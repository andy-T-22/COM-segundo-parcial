<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario COM - Parcial 3 (Cyberpunk Gótico)</title>
<style>
  :root {
    --bg: #050505;
    --bg-card: #0f0f12;
    --bg-card-hover: #1a1a1f;
    --border: #3d0000;
    --border-light: #5a0000;
    --primary: #ff003c;
    --primary-hover: #cc0030;
    --primary-light: rgba(255, 0, 60, 0.15);
    --primary-border: #ff3366;
    --success: #00ff9d;
    --success-bg: rgba(0, 255, 157, 0.1);
    --success-border: #008f58;
    --danger: #ff003c;
    --danger-bg: rgba(255, 0, 60, 0.1);
    --danger-border: #8f0022;
    --warning: #ffcc00;
    --warning-bg: rgba(255, 204, 0, 0.1);
    --star: #ffcc00;
    --text: #e0e0e0;
    --text-muted: #888888;
    --text-dim: #555555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 40px;
    background-image: radial-gradient(circle at 50% 50%, #1a0000 0%, #050505 100%);
  }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  
  /* Header */
  header {
    text-align: center;
    margin-bottom: 22px;
    padding-bottom: 15px;
    border-bottom: 2px solid var(--border);
  }
  h1 {
    color: var(--primary);
    font-size: 2.5em;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--primary);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 1em;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  /* Settings / Controls Card */
  .settings-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 16px 22px;
    margin-bottom: 25px;
    box-shadow: 0 0 15px rgba(255,0,60,0.2);
  }
  
  /* Menu */
  .menu-btn {
    padding: 14px 18px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    border-radius: 0;
    cursor: pointer;
    font-size: 0.95em;
    font-weight: 600;
    transition: all 0.3s;
  }
  .menu-btn:hover {
    background: var(--primary);
    color: #000;
    border-color: var(--primary);
    box-shadow: 0 0 20px var(--primary);
  }
  .menu-btn.exam-btn {
    grid-column: 1 / -1;
    background: #000;
    border: 2px solid var(--primary);
    color: var(--primary);
    font-size: 1.2em;
    padding: 18px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .menu-btn.exam-btn:hover {
    background: var(--primary);
    color: #000;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Cuestionario Parcial 3</h1>
    <div class="subtitle">Sistema de Evaluación - Protocolo Gótico Ciberpunk</div>
  </header>
  <div class="settings-card">
    <p>Interfaz inicializada. Esperando entrada de datos...</p>
  </div>
</div>
</body>
</html>
